server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Alamat "penerjemah nama" bawaan Docker. Dengan ini, Nginx tetap
    # menemukan Backend walau kontainernya dihapus lalu dibuat ulang.
    resolver 127.0.0.11 valid=5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /inventory {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }

    location /health {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }
}